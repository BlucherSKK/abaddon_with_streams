name: Release macOS x64

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release tag
        id: next_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1 2>/dev/null || true)
          fi
          echo "Previous release tag: '${LATEST_TAG}'"

          TAG=$(python3 -c "
          import sys
          raw = '''$LATEST_TAG'''.strip()
          if not raw or raw == 'null':
              print('0.0.1')
              sys.exit(0)

          clean = raw.lstrip('v')
          parts = clean.split('.')
          while len(parts) < 3:
              parts.append('0')

          try:
              parts[-1] = str(int(parts[-1]) + 1)
              print('.'.join(parts))
          except ValueError:
              print('0.0.1')
          ")
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Abaddon (macosx64)
        run: |
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Prepare release packages
        run: |
          TAG="${{ steps.next_tag.outputs.tag }}"
          PACKAGE_DIR="abaddon-macosx64-${TAG}"
          mkdir -p "$PACKAGE_DIR"
          cp target/x86_64-apple-darwin/release/abaddon "$PACKAGE_DIR/abaddon"
          if [ -d ui ]; then
            cp -r ui "$PACKAGE_DIR/ui"
          fi
          if [ -d res ]; then
            cp -r res "$PACKAGE_DIR/res"
          fi
          tar -czvf "abaddon-macosx64-${TAG}.tar.gz" "$PACKAGE_DIR"
          zip -r "abaddon-macosx64-${TAG}.zip" "$PACKAGE_DIR"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.next_tag.outputs.tag }}"
          gh release create "$TAG" \
            "abaddon-macosx64-${TAG}.tar.gz" \
            "abaddon-macosx64-${TAG}.zip" \
            --title "$TAG" \
            --notes "Release $TAG for macOS x64 (macosx64)"
